name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules for llama.cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake + build-tools
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Generate Gradle wrapper (repo has no committed gradlew)
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build release APK
        env:
          HF_MANIFEST_URL: ${{ secrets.HF_MANIFEST_URL }}
        run: |
          ./gradlew assembleRelease -PHF_MANIFEST_URL="$HF_MANIFEST_URL"

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyra-release-apk
          path: ${{ steps.sign.outputs.signedReleaseFile }}
